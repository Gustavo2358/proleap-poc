name: Semantic Product gates
on:
  pull_request:
  push:
    branches: [main, feat/semantic-product-scalar-move, feat/cp6-w1a-call-semantic-product]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Full harness
        run: ./scripts/harness/check-full.sh
      - name: Structural performance probes
        run: ./scripts/harness/check-performance.sh
      - name: Semantic mutation challenges and restored GREEN
        run: python3 scripts/harness/challenge-scalar-move.py
      - name: CP6 W1A semantic challenges and restored GREEN
        run: python3 scripts/harness/challenge-call-w1a.py
