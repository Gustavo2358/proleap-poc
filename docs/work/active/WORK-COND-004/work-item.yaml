id: WORK-COND-004
title: Preservar estrutura nominal completa de condition-name references
status: active
risk: high
goal: Representar na surface AST, com node tipado próprio, a estrutura nominal completa escrita de uma condition-name reference — nome, qualification IN/OF, subscripts e provenance — sem lookup, binding, expansão ou decisão DATA/INDEX/CONDITION, mantendo ContextualConditionTail contextual e sem redesign semântico do collector/resolver.
