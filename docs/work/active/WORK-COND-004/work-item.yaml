# DataAndIndexReferenceResolver permanece FORA de must_not_change com adaptação mínima
# policy-preserving: apenas o case novo de QualifierTarget.UNSPECIFIED em qualifierConstraints,
# mapeado conservadoramente a {DATA} (conjunto de constraints idêntico ao atual; seleção de
# candidates provadamente inalterada). A ampliação para {DATA, FILE} está bloqueada por
# BACKLOG-RES-004 (IBM resolution-of-names step 3) e NÃO pertence a este slice.
# AstSnapshot e ReferenceOccurrenceCollector voltaram a must_not_change: com a decisão D
# (DataReference corrigido, sem node novo) ambos permanecem byte-identical.
must_not_change:
  - src/main/antlr4/Cobol.g4
  - src/main/java/io/github/gustavo2358/cobolexplorer/AstSnapshot.java
  - src/main/java/io/github/gustavo2358/cobolexplorer/ReferenceOccurrenceCollector.java
  - src/main/java/io/github/gustavo2358/cobolexplorer/CobolReferenceResolver.java
