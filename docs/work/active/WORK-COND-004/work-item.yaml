id: WORK-COND-004
title: Preservar estrutura nominal completa de condition-name references
status: active
risk: high
goal: Representar na surface AST, de forma estrutural completa e lossless, a estrutura nominal escrita de uma condition-name reference — nome, qualification IN/OF, subscripts e provenance — corrigindo o lowering do payload nominal existente (DataReference) a partir dos children diretos do context, sem lookup, binding, expansão ou decisão DATA/INDEX/CONDITION, mantendo a distinção posicional pelos containers tipados existentes (ContextualConditionTail) e classificando o namespace do qualifier como UNSPECIFIED, mapeado conservadoramente pelo resolver até BACKLOG-RES-004.
