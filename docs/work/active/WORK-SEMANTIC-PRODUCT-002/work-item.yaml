  - WORK-AST-002, F-01, BACKLOG-RES-003 and any other active work item scope
  - EVALUATE, PERFORM, GO TO, terminal, ALTER and SEARCH frontend enrichment outside the IF/ELSE slice
  - CobolLower, Analysis IR, CFG, Statement Effects, Storage Semantics, dataflow, Reaching Definitions, Possible Values and Dependency Facts
  - semantic-product.json or its JSON output adapter before Checkpoint 7
  - future CobolLower repository, JSON input adapter, LowererInputPort and in-memory integration adapter
  - generic serializer/framework, public interchange schema, round-trip, persistence, persistent identity/migration and universal multi-language Semantic Product
  - existing production fixtures, baselines and historical experimental classes except the new oracle explicitly authorized by Checkpoint 1
