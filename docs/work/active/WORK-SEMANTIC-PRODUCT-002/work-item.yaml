must_not_change:
  - src/main/antlr4/**
  - AST, grammar, symbol table, occurrence collector, nominal resolver and existing parser behavior
  - WORK-AST-002, F-01, BACKLOG-RES-003 and any other active work item scope
  - CobolLower, Canonical Analysis IR, CFG, dataflow, possible-values and dependency extraction; the future lowerer core depends on its LowererInputPort, with a JSON input adapter or an in-memory adapter outside the core
  - generic serializer/framework, public interchange schema, round-trip, persistence, universal multi-language abstraction and HTML/snapshot contracts
  - semantic-product.json or its JSON output adapter before the later JSON checkpoint, JSON inside Semantic Product/state/port or JSON parsing in the future lowerer core
  - future CobolLower repository, JSON input adapter, LowererInputPort and in-memory integration adapter; this work item documents their required boundary but does not implement them
  - plugin framework, universal multi-language Semantic Product and external-language analyzers
  - existing production fixtures, baselines and test-only experimental classes, except a new oracle explicitly authorized by a checkpoint
