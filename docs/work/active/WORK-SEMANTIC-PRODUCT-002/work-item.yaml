id: WORK-SEMANTIC-PRODUCT-002
title: Semantic Product de produção para MOVE literal e CALL variável
status: active
risk: high
goal: Materializar em memória um Semantic Product COBOL-specific, fechado e imutável, que publique o slice provado MOVE literal → CALL variável por uma facade tipada sem inferir target de runtime e, em checkpoint posterior, produza semantic-product.json por um JSON output adapter determinístico, versionável, documentado e semanticamente suficiente para inspeção e desenvolvimento isolado, sem transformar JSON em domínio ou dependência dos cores.
