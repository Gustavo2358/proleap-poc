must_not_change:
  - semântica COBOL legítima de DFHRESP e DFHVALUE declarados ou resolvidos
  - Ast e AstBuilder com conhecimento prematuro de plataforma
  - CobolReferenceResolver e DataAndIndexReferenceResolver com branches CICS
  - gramática ANTLR e manifestos de cobertura por correção oportunista
  - ReferenceResolution status candidates reasons diagnostics ou semântica nominal
  - CFG dataflow reaching definitions e possible-values
  - External Symbol Providers e símbolos EIB
  - Semantic Extractors e dependências CICS IMS DB2 ou GRBE
  - Control-Flow Semantics Providers
  - infraestrutura completa de plugins registry discovery ou DI
  - itens de backlog e tecnologias além do classifier mínimo autorizado
gates:
